<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MKLookup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f2f2f2;
            color: #000;
        }

        body.dark {
            background: #121212;
            color: #fff;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #004aad;
            color: white;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #theme-toggle, #refresh-btn, #menu-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        #theme-toggle {
            background: #ffffff22;
            color: white;
        }

        #refresh-btn {
            background: #ffffff22;
            color: white;
        }

        #menu-btn {
            background: #ffffff22;
            color: white;
        }

        #search {
            width: 90%;
            margin: 20px auto;
            display: block;
            padding: 12px;
            font-size: 18px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0 15px;
        }

        /* NEW MEMBER LAYOUT */
        .member-item {
            display: block;
            padding: 12px;
            margin: 10px 0;
            background: #ffffff;
            border-radius: 6px;
        }

        .member-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .member-pin {
            margin-top: 4px;
            font-size: 1rem;
            color: #444;
        }

        body.dark .member-item {
            background: rgba(255,255,255,0.1);
        }

        body.dark .member-pin {
            color: #ccc;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <button id="menu-btn">☰</button>
            <button id="theme-toggle">🌙</button>
        </div>

        <div class="header-right">
            <button id="refresh-btn">Refresh</button>
        </div>
    </header>

    <input type="text" id="search" placeholder="Search member..." />

    <ul id="member-list"></ul>

    <script src="app.js"></script>
</body>
</html>
